services:
  db:
    image: mariadb:10.11
    container_name: b1_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: TodoDb
      MARIADB_USER: nam_admin
      MARIADB_PASSWORD: adminpassword123
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend_network
  mongodb:
    image: mongo:latest
    container_name: b1_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: 
      - backend_network
  redis:
    image: redis:alpine
    container_name: b1_redis
    ports:
      - "6379:6379"
    networks:
      - backend_network
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b1_api
    ports:
      - "8080:8080"
    depends_on:
      - db
      - mongodb
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=TodoDb;Uid=root;Pwd=rootpassword123;
      - ConnectionStrings__MongoConnection=mongodb://mongodb:27017
      - MongoDatabaseName=TodoAuditDb
      - ConnectionStrings__RedisConnection=redis:6379
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
volumes:
  mariadb_data: 
  mongo_data: